{# The trust label (UX-DR20): the word is always text, the shape is decoration and hidden from screen readers. Needs label and large. #}
<span class="pill pill-{{ label.kind }}{% if large %} pill-large{% endif %}">{% if large %}<svg width="14" height="14" viewBox="0 0 12 12" aria-hidden="true">{% else %}<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">{% endif %}{% if label.shape == "circle" %}<circle cx="6" cy="6" r="5" fill="currentColor"/>{% elif label.shape == "triangle" %}<path d="M6 1 11.5 11H.5z" fill="currentColor"/>{% else %}<rect x="1" y="1" width="10" height="10" fill="currentColor"/>{% endif %}</svg>{{ label.word }}</span>
